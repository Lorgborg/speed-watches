openapi: 3.1.0
servers:
  - url: https://server-pc.tail66b2ee.ts.net/api/
    description: api production server
  - url: http://localhost:3000/api/
    description: Local dev server
info:
  title: Speed-watches
  description: >
    This API is for G2R members to take notes on the matchups they may
    encounter on league of legends. Note that a **bypass is required to
    access the api**.


    ⚠️ All routes — including the POST/DELETE ones — currently read their
    parameters from the **query string** ('req.query'), not the JSON
    request body. This documentation reflects that as implemented.
  version: 1.4.0
tags:
  - name: Get
    description: Endpoints for retrieving matchup notes, game data, and user data
  - name: Post
    description: Endpoints for creating users, creating/appending matchup notes, and scoring games
  - name: Update
    description: Endpoints intended to modify existing users or matchup notes
  - name: Remove
    description: Endpoints intended to remove matchup notes, notes, or users
  - name: Known Issues
    description: >
      Routes that are registered and reachable, but have bugs in their
      current implementation that mean they don't behave as their name
      suggests or silently misbehave on certain inputs. Included here so
      the surface area is visible, but none of these should be relied on
      until fixed.
components:
  schemas:
    Matchup:
      type: object
      properties:
        puuid:
          type: string
          example: "KdSK9Qcz1G71dOd0VvbMEv2QVL8Htr5MGdjS9vbprajckLR9zMYo8AWUlEzCzs780N9Eckq1TLzh4g"
        championFighting:
          type: string
          example: "Yone"
        championPlayed:
          type: string
          example: "Renekton"
        matchIds:
          type: array
          items:
            type: string
          example: ["SG2_161017792", "SG2_138469723"]
        pushing:
          type: string
          nullable: true
        teamFighting:
          type: string
          nullable: true
        laning:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        role:
          type: string
          example: "TOP"
        username:
          type: string
          example: "rin"
        discordId:
          type: string
          example: "400599101353492480"
    User:
      type: object
      description: A row from the postgres 'users' table.
      properties:
        username:
          type: string
          example: "rin"
        discordId:
          type: string
          example: "400599101353492480"
        puuid:
          type: string
          example: "KdSK9Qcz1G71dOd0VvbMEv2QVL8Htr5MGdjS9vbprajckLR9zMYo8AWUlEzCzs780N9Eckq1TLzh4g"
        summonerName:
          type: string
          nullable: true
        accountDetails:
          type: object
          description: Raw Riot summoner details, cached at user-creation/update time
        rank:
          type: array
          description: Raw Riot ranked-entries payload, cached at user-creation/update time
        topMastery:
          type: array
          description: Player's top champion mastery entries, cached at user-creation/update time
        backfillComplete:
          type: boolean
          description: Whether historical match backfill has finished for this user
    GameRow:
      type: object
      description: A row from the postgres 'games' table, joined with 'users'.
      properties:
        username:
          type: string
        puuid:
          type: string
        match_id:
          type: string
        champion_played:
          type: string
        champion_fighting:
          type: string
        role:
          type: string
        kda:
          type: string
          example: "5/2/9"
        is_win:
          type: boolean
        game_length:
          type: integer
          description: Game length in seconds
        champ_composition:
          type: array
          items:
            type: string
        laning:
          type: string
          nullable: true
        team_fighting:
          type: string
          nullable: true
        info:
          type: object
          description: Raw Riot match 'info' payload (only returned by /get/gameInfo)
    RecentGameRow:
      type: object
      description: A row from 'games' aggregated with any applicable matchup notes.
      properties:
        match_id:
          type: string
        game_creation:
          type: string
          description: Riot match creation timestamp
        champion_played:
          type: string
        champion_fighting:
          type: string
        role:
          type: string
        kda:
          type: string
          example: "5/2/9"
        is_win:
          type: boolean
        notes_applicable:
          type: array
          description: Any matchup notes whose champion_fighting/matchIds overlap this game
          items:
            type: object
            properties:
              champion_fighting:
                type: string
              notes:
                type: array
                items:
                  type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
paths:

  /get/matchup:
    get:
      summary: Get matchup notes
      description: >
        Retrieves matchup notes filtered by any combination of champion played,
        champion fighting, role, or user identity. At most one of 'puuid',
        'summonerName', or 'discordId' may be supplied to identify the user.
      tags:
        - Get
      parameters:
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
          description: Champion the note author was playing
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
          description: Opposing champion in the matchup
        - name: role
          in: query
          required: false
          schema:
            type: string
          description: Lane/role for the matchup
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID of the note author. Mutually exclusive with summonerName/discordId.
        - name: summonerName
          in: query
          required: false
          schema:
            type: string
          description: >
            Summoner name, resolved to a PUUID via the Riot API at request time.
            Mutually exclusive with puuid/discordId.
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Discord ID of the note author. Mutually exclusive with puuid/summonerName.
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: G2R username of the note author (additional filter, not an identifier)
      responses:
        '200':
          description: Matching matchup notes with aggregated win/loss counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    summoner_name:
                      type: string
                    discord_id:
                      type: string
                    champion_played:
                      type: string
                    champion_fighting:
                      type: string
                    role:
                      type: string
                    notes:
                      type: string
                    wins:
                      type: integer
                    lose:
                      type: integer
        '400':
          description: >
            Invalid query parameters, or more than one of
            puuid/summonerName/discordId supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: No matching notes found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: Conflict (unique constraint violation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Unexpected server or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to resolve summonerName via the Riot API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /get/totalWR:
    get:
      summary: Get total win rate for a matchup
      description: >
        Aggregates win/loss counts for matchups filtered by champion played,
        champion fighting, role, discord ID, or puuid, and returns an overall
        win rate. Either 'puuid' or 'discordId' is required.
      tags:
        - Get
      parameters:
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID. Either this or discordId is required.
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
        - name: isWinFirst
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: If "true", sorts results by wins descending; otherwise sorts by losses descending.
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Discord ID. Either this or puuid is required.
      responses:
        '200':
          description: Aggregated win/loss breakdown per matchup, plus overall totals and win rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  withWinRate:
                    type: array
                    items:
                      type: object
                      properties:
                        champion_played:
                          type: string
                        champion_fighting:
                          type: string
                        role:
                          type: string
                        wins:
                          type: string
                        loss:
                          type: string
                        winRate:
                          type: number
                          format: float
                  wr:
                    type: integer
                  totalWins:
                    type: integer
                  totalLoss:
                    type: integer
        '400':
          description: Neither puuid nor discordId was provided, or a Zod validation error occurred
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["Error: Invalid option: expected one of \"true\"|\"false\""]
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /get/user:
    get:
      tags:
        - Get
      summary: Get a user by username, puuid, or discord ID
      description: >
        Looks up matching row(s) from the 'users' table.
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: discordId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching user row(s)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "500":
          description: >
            Invalid query parameters (see known issue above — this route
            does not distinguish invalid input from a real server error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /get/recent:
    get:
      tags:
        - Get
      summary: Get the most recent game(s), with any applicable matchup notes attached
      description: >
        Retrieves the most recent rows from 'games' (newest first), left-joined
        against 'notes' so any note whose champion/matchId overlaps the game is
        attached under 'notes_applicable'. Unlike '/get/matchup', no identifying
        field is required — omitting all filters returns the most recent
        game(s) across every user.
      parameters:
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
        - name: discordId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: "1"
      responses:
        "200":
          description: Most recent matching game row(s), newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentGameRow"
        "500":
          description: >
            Invalid query parameters (see known issue above), or an
            unexpected server/database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /get/game:
    get:
      tags:
        - Get
      summary: Get game rows
      description: >
        Gets games joined with their owning user, newest first. All of
        'puuid', 'matchId', 'championFighting', and 'championPlayed' are
        applied directly to the WHERE clause when supplied, so filtering
        by 'matchId' alone returns exactly that game. Results are capped
        at 'limit' (default 10) and explicitly ordered by
        'g.game_creation DESC'.
      parameters:
        - name: discordId
          in: query
          required: true
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: matchId
          in: query
          required: false
          schema:
            type: string
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: "10"
      responses:
        '200':
          description: Matching game row(s), joined with the owning user, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameRow"
        '400':
          description: Invalid query parameters
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Unexpected server or database error
          content:
            text/plain:
              schema:
                type: string

  /get/gameInfo:
    get:
      tags:
        - Get
      summary: Get game rows including full raw match info
      description: >
        Gets games joined with their owning user, including the raw Riot
        match 'info' payload. This is expensive to fetch — please filter
        with 'discordId' and other parameters rather than pulling everything.
      parameters:
        - name: discordId
          in: query
          required: true
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: matchId
          in: query
          required: false
          schema:
            type: string
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Matching game row(s), including raw match info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameRow"
        '500':
          description: >
            Unexpected server or database error (also returned for invalid
            query parameters — errors are sent via 'res.send(e)' with no
            status code override, so the transport-level status is used
            rather than a distinguishing code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /post/user:
    post:
      tags:
        - Post
      summary: Create a user
      description: >
        Creates a row in the 'users' table. Parameters are read from the
        **query string**, not a JSON body. Either 'puuid' or 'summonerName'
        must be provided — if 'summonerName' is given it's resolved to a
        PUUID via the main Riot token, which becomes the canonical stored
        puuid. Kicks off an async match-history backfill on success.
      parameters:
        - name: discordId
          in: query
          required: true
          schema:
            type: string
          description: Discord snowflake ID; validated as a 17-19 digit numeric ID with a plausible creation timestamp
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID. Provide this or summonerName.
        - name: summonerName
          in: query
          required: false
          schema:
            type: string
          description: Riot ID (e.g. "Name#TAG"). Provide this or puuid.
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Defaults to "none" if omitted
      responses:
        "200":
          description: User saved successfully
          content:
            text/plain:
              schema:
                type: string
                example: "user with info <puuid> saved"
        "400":
          description: >
            Invalid query parameters, invalid discordId, neither
            puuid nor summonerName supplied, or the user/discordId
            already exists
          content:
            text/plain:
              schema:
                type: string

  /post/matchupNote:
    post:
      tags:
        - Post
      summary: Append notes to a matchup
      description: >
        Appends the given note strings onto the existing 'notes' array for
        matching row(s) in the 'notes' table ('notes = notes || <new notes>').
        Parameters are read from the query string. Correctly scopes the
        update via 'notes.puuid = users.puuid' plus the supplied filters, so
        'discordId'-only filtering is safe here. Returns '404' if nothing
        matched. See also '/update/matchupNote', which shares this route's
        intent but has its own, separate known issues.
      parameters:
        - name: discordId
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: notes
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
            example: ["Don't int"]
          description: A single string is also accepted and will be wrapped in an array.
        - name: championFighting
          in: query
          required: true
          schema:
            type: string
        - name: championPlayed
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Note updated
          content:
            text/plain:
              schema:
                type: string
                example: "note updated"
        "400":
          description: Invalid query parameters, or neither puuid nor discordId supplied
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No matching matchup note found
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Unexpected server error
          content:
            text/plain:
              schema:
                type: string

  /post/gameScore:
    post:
      tags:
        - Post
      summary: Set pushing/laning/teamFighting scores on a game
      description: >
        Updates the 'pushing', 'laning', and/or 'teamFighting' columns on a
        row in the 'games' table. Parameters are read from the query string.
        If 'matchId' is omitted, the latest matching game is looked up first
        and its 'matchId' is folded back into the filters before the update
        runs, so the update is correctly scoped either way. Returns '404' if
        no row was updated (this used to always report success — that bug is
        fixed).
      parameters:
        - name: discordId
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: matchId
          in: query
          required: false
          schema:
            type: string
          description: If omitted, the most recent matching game (by the other filters) is targeted.
        - name: pushing
          in: query
          required: false
          schema:
            type: string
        - name: laning
          in: query
          required: false
          schema:
            type: string
        - name: teamFighting
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A row was found and updated
          content:
            application/json:
              schema:
                type: boolean
                example: true
        "400":
          description: >
            Invalid query parameters, or none of pushing/laning/teamFighting
            supplied
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No matching game found, or no matching game found to update
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Unexpected server error
          content:
            text/plain:
              schema:
                type: string

  /update/matchupNote:
    post:
      tags:
        - Update
        - Known Issues
      summary: Append notes to a matchup (update variant)
      description: >
        Intended to be functionally identical to '/post/matchupNote', but the
        implementations have diverged and this route has several open bugs.
        Parameters are read from the query string.


        🚧 **Known issues:**
          - The update query joins 'notes' against 'users' ('FROM users') but
            never adds a join predicate tying 'notes.puuid' to 'users.puuid'
            (unlike '/post/matchupNote' and '/remove/matchupNote', which both
            have this predicate). Filtering only by 'discordId' does not
            reliably scope the update to that user's notes.
          - Field descriptors on this route's schema use plain 'where'
            instead of qualified 'where:table.column', so a supplied
            'discordId' or 'puuid' can resolve to an ambiguous column
            reference between 'notes' and 'users' at query time.
          - 'notes' must be submitted as an actual array — the
            single-string-to-array convenience wrapping that
            '/post/matchupNote' and '/remove/matchupNote' have is not
            present here.
          - There is no check requiring at least one of 'puuid'/'discordId'
            to be supplied.
          - The handler has no try/catch, so a database error or malformed
            query throws unhandled rather than returning a controlled
            response.
          - The route always responds '200' with "note updated", even if the
            WHERE clause matched zero rows.
      parameters:
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: See known issues above — may cause an ambiguous-column error or an under-scoped update.
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: See known issues above — may cause an ambiguous-column error or an under-scoped update.
        - name: notes
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: Must be supplied as an array — a single bare string is not auto-wrapped on this route.
        - name: championFighting
          in: query
          required: true
          schema:
            type: string
        - name: championPlayed
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Always returned if the request reaches the query (see known
            issues above — this does not confirm any row was actually
            updated)
          content:
            text/plain:
              schema:
                type: string
                example: "note updated"

  /update/user:
    post:
      tags:
        - Update
        - Known Issues
      summary: Refresh cached Riot data for an existing user
      description: >
        Intended to re-resolve identity and refresh 'account_details',
        'rank', and 'top_mastery' for a user that already exists, keyed by
        'discordId'. Parameters are read from the query string.


        🚧 **Known issue:** this route's duplicate-check logic was copied
        from '/post/user' (create) without being adapted for update
        semantics. Before running the 'UPDATE', it queries for any existing
        row with a matching 'puuid' OR 'discordId' and returns '400' "The
        discord id is already in the database" if one is found — but since
        an update target must already exist by definition, this check will
        reject essentially every legitimate call to this route. In its
        current state, '/update/user' cannot successfully update an existing
        user. Do not rely on this route until the duplicate-check is fixed
        to allow updating the row it just found instead of rejecting it.
      parameters:
        - name: discordId
          in: query
          required: true
          schema:
            type: string
          description: Discord snowflake ID identifying the row to update.
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID. Provide this or summonerName.
        - name: summonerName
          in: query
          required: false
          schema:
            type: string
          description: Riot ID (e.g. "Name#TAG"). Provide this or puuid.
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Defaults to "none" if omitted
      responses:
        "200":
          description: User updated successfully (see known issue above — currently unreachable in normal use)
          content:
            text/plain:
              schema:
                type: string
                example: "user with info <puuid> saved"
        "400":
          description: >
            Invalid query parameters, invalid discordId, neither puuid nor
            summonerName supplied, or — per the known issue above — the
            discordId/puuid already existing (which will be true for any
            real update target)
          content:
            text/plain:
              schema:
                type: string

  /remove/matchupNote:
    delete:
      tags:
        - Remove
      summary: Remove specific note strings from a matchup
      description: >
        Removes only the note strings passed in 'notes' from the matching
        row(s)' 'notes' array (via 'unnest'/'<> ALL(...)'), leaving any other
        notes on that row intact. If every note on a row is removed, the
        row's 'notes' array becomes empty rather than the row being deleted.
        Correctly scopes the update via 'notes.puuid = users.puuid' plus the
        supplied filters. Returns '404' if nothing matched.
      parameters:
        - name: discordId
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: notes
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: The exact note string(s) to remove. A single string is also accepted and will be wrapped in an array.
        - name: championFighting
          in: query
          required: true
          schema:
            type: string
        - name: championPlayed
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Note(s) removed
          content:
            text/plain:
              schema:
                type: string
                example: "1 note row(s) deleted"
        "400":
          description: Invalid query parameters, or neither puuid nor discordId supplied
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No matching matchup note found
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Unexpected server error
          content:
            text/plain:
              schema:
                type: string

  /remove/note:
    delete:
      tags:
        - Remove
      summary: Delete matching note row(s) outright
      description: >
        Deletes entire row(s) from the 'notes' table matching the supplied
        filters (required 'championFighting'/'championPlayed', optional
        'role'/'puuid'/'discordId'), rather than removing individual note
        strings from a row's array — use '/remove/matchupNote' if you only
        want to drop specific note strings and keep the rest. Requires at
        least one of 'puuid' or 'discordId'. Correctly joins 'notes' to
        'users' for scoping.
      parameters:
        - name: discordId
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: championFighting
          in: query
          required: true
          schema:
            type: string
        - name: championPlayed
          in: query
          required: true
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Note row(s) deleted
          content:
            text/plain:
              schema:
                type: string
                example: "2 note row(s) deleted"
        "400":
          description: Invalid query parameters, or neither puuid nor discordId supplied
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No matching matchup note found
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Unexpected server error
          content:
            text/plain:
              schema:
                type: string

  /remove/user:
    delete:
      tags:
        - Remove
      summary: Remove a user and their associated games/notes
      description: >
        Looks up the user by 'puuid' (if supplied) or 'discordId', then
        deletes their rows from 'notes', 'games', and 'users' in a single
        transaction. Requires at least one of 'puuid' or 'discordId'.
      parameters:
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Currently required in practice — see known issue above.
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: See known issue above — supplying this without discordId currently fails.
      responses:
        "200":
          description: User and associated data deleted
          content:
            text/plain:
              schema:
                type: string
                example: "user <puuid> and associated data deleted"
        "400":
          description: Invalid query parameters, or neither puuid nor discordId supplied
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No matching user found
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: >
            Unexpected server error, or (per known issue above) puuid
            supplied without discordId
          content:
            text/plain:
              schema:
                type: string