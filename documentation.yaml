openapi: 3.1.0
servers:
  - url: https://server-pc.tail66b2ee.ts.net/api/
    description: api production server
  - url: http://localhost:3000/api/
    description: Local dev server
info:
  title: Speed-watches
  description: This API is for G2R members to take notes on the matchups they may encounter on league of legends. Note that a **bypass is required to access the api**
  version: 1.1.0
tags:
  - name: Get
    description: Endpoints for retrieving matchup notes and user data
  - name: Post
    description: Endpoints for creating users and matchup/game notes
  - name: WIP
    description: >
      Routes that are registered but not yet functional. Included here so the
      surface area is visible, but none of these should be relied on yet.
components:
  schemas:
    Matchup:
      type: object
      properties:
        puuid:
          type: string
          example: "KdSK9Qcz1G71dOd0VvbMEv2QVL8Htr5MGdjS9vbprajckLR9zMYo8AWUlEzCzs780N9Eckq1TLzh4g"
        championFighting:
          type: string
          example: "Yone"
        championPlayed:
          type: string
          example: "Renekton"
        matchIds:
          type: array
          items:
            type: string
          example: ["SG2_161017792", "SG2_138469723"]
        pushing:
          type: string
          nullable: true
        teamFighting:
          type: string
          nullable: true
        laning:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        role:
          type: string
          example: "TOP"
        username:
          type: string
          example: "rin"
        discordId:
          type: string
          example: "400599101353492480"
    User:
      type: object
      description: A row from the postgres `users` table.
      properties:
        username:
          type: string
          example: "rin"
        discordId:
          type: string
          example: "400599101353492480"
        puuid:
          type: string
          example: "KdSK9Qcz1G71dOd0VvbMEv2QVL8Htr5MGdjS9vbprajckLR9zMYo8AWUlEzCzs780N9Eckq1TLzh4g"
paths:

  /get/matchup:
    get:
      summary: Get matchup notes
      description: >
        Retrieves matchup notes filtered by any combination of champion played,
        champion fighting, role, or user identity (username, discord ID, puuid,
        or summoner name). At least one query parameter is required.
      tags:
        - Get
      parameters:
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
          description: Champion the note author was playing
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
          description: Opposing champion in the matchup
        - name: role
          in: query
          required: false
          schema:
            type: string
          description: Lane/role for the matchup
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID of the note author
        - name: summonerName
          in: query
          required: false
          schema:
            type: string
          description: Summoner name, resolved to a PUUID via the Riot API
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Discord ID of the note author
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: G2R username of the note author
      responses:
        '200':
          description: Matching matchup notes with aggregated win/loss counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    puuid:
                      type: string
                    champion_played:
                      type: string
                    champion_fighting:
                      type: string
                    role:
                      type: string
                    notes:
                      type: string
                    wins:
                      type: integer
                      description: Count of recorded wins for this matchup
                    lose:
                      type: integer
                      description: Count of recorded losses for this matchup
        '400':
          description: Invalid or missing query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
        '404':
          description: No matching notes found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No matching notes found
        '409':
          description: Conflict (unique constraint violation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Unexpected server or database error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /get/totalWR:
    get:
      summary: Get total win rate for a matchup
      description: >
        Aggregates win/loss counts for matchups filtered by champion played,
        champion fighting, role, discord ID, or puuid, and returns an overall
        win rate. Either puuid or discordId is required.
      tags:
        - Get
      parameters:
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
          description: Champion the player was playing
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID. Either this or discordId is required.
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
          description: Opposing champion in the matchup
        - name: role
          in: query
          required: false
          schema:
            type: string
          description: Lane/role for the matchup
        - name: isWinFirst
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: If "true", sorts results by wins descending; otherwise sorts by losses descending.
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Discord ID. Either this or puuid is required.
      responses:
        '200':
          description: Aggregated win/loss breakdown per matchup, plus overall totals and win rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  withWinRate:
                    type: array
                    items:
                      type: object
                      properties:
                        champion_played:
                          type: string
                        champion_fighting:
                          type: string
                        role:
                          type: string
                        wins:
                          type: string
                          description: Win count (returned as string from Postgres COUNT)
                        loss:
                          type: string
                          description: Loss count (returned as string from Postgres COUNT)
                        winRate:
                          type: number
                          format: float
                          description: wins / (wins + loss) for this specific matchup
                  wr:
                    type: integer
                    description: Overall win rate percentage across all matched rows, rounded
                  totalWins:
                    type: integer
                  totalLoss:
                    type: integer
        '404':
          description: Neither puuid nor discordId was provided
          content:
            text/plain:
              schema:
                type: string
                example: either puuid or discordId must be filled
        '409':
          description: Invalid query parameters (Zod validation failure) or other request-time error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["Error: Invalid option: expected one of \"true\"|\"false\""]

  /get/user:
    get:
      tags:
        - Get
      summary: Get a user by username, puuid, or discord ID
      description: >
        Looks up a row from the `users` table. Checked in order of precedence:
        `username` first, then `puuid`, then `discordId`. If none are provided,
        no query is run and the response body will be empty.
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: G2R username. Takes priority over puuid and discordId if provided.
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID. Validated against the Riot API before querying.
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Discord snowflake ID. Must match `^\d{17,19}$`.
      responses:
        "200":
          description: Matching user row(s)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: puuid failed Riot API validation, or discordId is not a valid snowflake format
          content:
            text/plain:
              schema:
                type: string
                example: "Error: Discord Id is not a valid format"

  /post/user:
    post:
      tags:
        - Post
      summary: Create a user
      description: >
        Creates a row in the `users` table. Either `puuid` or `summonerName`
        must be provided — if `summonerName` is given, it is resolved to a
        PUUID via the Riot API before insert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - discordId
              properties:
                username:
                  type: string
                  example: "rin"
                discordId:
                  type: string
                  example: "400599101353492480"
                puuid:
                  type: string
                  nullable: true
                  example: "KdSK9Qcz1G71dOd0VvbMEv2QVL8Htr5MGdjS9vbprajckLR9zMYo8AWUlEzCzs780N9Eckq1TLzh4g"
                summonerName:
                  type: string
                  nullable: true
                  description: Riot ID (e.g. "Name#TAG"). Resolved to a puuid server-side if provided.
                  example: "rin#NA1"
      responses:
        "200":
          description: User saved successfully
          content:
            text/plain:
              schema:
                type: string
                example: "successfully saved"
        "401":
          description: Discord ID format invalid, puuid failed Riot API validation, or a required field was missing
          content:
            text/plain:
              schema:
                type: string
                example: "Error: Discord Id is not a valid format"

  /post/matchupNote:
    post:
      tags:
        - WIP
      summary: Update the note text on an existing matchup
      description: >
        🚧 **Not yet functional.** Intended to append a note to a matchup
        record. Currently registered as `router.get('post/matchupNote', ...)`
        in `api/routes/post/matchupNote.ts` — this both uses the wrong HTTP
        verb (GET instead of POST) and is missing the leading `/` in its
        path, so it will not resolve at `/api/post/matchupNote` as intended.
        The update query itself is also incomplete. Do not call this route
        until it's fixed.
      parameters:
        - name: matchId
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
        - name: note
          in: query
          required: true
          schema:
            type: string
      responses:
        "501":
          description: Not implemented

  /post/gameNote:
    post:
      tags:
        - WIP
      summary: Add a note to a specific game
      description: >
        🚧 **Not yet functional.** Stub route in `api/routes/post/gameNote.ts`
        — currently `router.get('post/gameNote', ...)` with no request
        handling logic and a path missing its leading `/`.
      responses:
        "501":
          description: Not implemented

  /get/game:
    get:
      tags:
        - WIP
      summary: Get game data
      description: >
        🚧 **Not yet functional.** Stub route in `api/routes/get/game.ts` —
        registered as `router.get("get/game", ...)` (missing leading `/`)
        with no request handling logic.
      responses:
        "501":
          description: Not implemented