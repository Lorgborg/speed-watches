openapi: 3.1.0
servers:
  - url: https://server-pc.tail66b2ee.ts.net/api/
    description: api production server
  - url: http://localhost:3000/api/
    description: Local dev server
info:
  title: Speed-watches
  description: This API is for G2R members to take notes on the matchups they may encounter on league of legends. Note that a **bypass is required to access the api**
  version: 1.0.0
tags:
  - name: Get
    description: Endpoints for retrieving matchup notes
  - name: Push
    description: Endpoints for creating or updating matchup notes
components:
  schemas:
    Matchup:
      type: object
      properties:
        puuid:
          type: string
          example: "KdSK9Qcz1G71dOd0VvbMEv2QVL8Htr5MGdjS9vbprajckLR9zMYo8AWUlEzCzs780N9Eckq1TLzh4g"
        championFighting:
          type: string
          example: "Yone"
        championPlayed:
          type: string
          example: "Renekton"
        matchIds:
          type: array
          items:
            type: string
          example: ["SG2_161017792", "SG2_138469723"]
        pushing:
          type: string
          nullable: true
        teamFighting:
          type: string
          nullable: true
        laning:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        role:
          type: string
          example: "TOP"
        username:
          type: string
          example: "rin"
        discordId:
          type: string
          example: "400599101353492480"
paths:
  
  /get/matchup:
    get:
      summary: Get matchup notes
      description: >
        Retrieves matchup notes filtered by any combination of champion played,
        champion fighting, role, or user identity (username, discord ID, puuid,
        or summoner name). At least one query parameter is required.
      tags:
        - Get
      parameters:
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
          description: Champion the note author was playing
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
          description: Opposing champion in the matchup
        - name: role
          in: query
          required: false
          schema:
            type: string
          description: Lane/role for the matchup
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID of the note author
        - name: summonerName
          in: query
          required: false
          schema:
            type: string
          description: Summoner name, resolved to a PUUID via the Riot API
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Discord ID of the note author
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: G2R username of the note author
      responses:
        '200':
          description: Matching matchup notes with aggregated win/loss counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    puuid:
                      type: string
                    champion_played:
                      type: string
                    champion_fighting:
                      type: string
                    role:
                      type: string
                    notes:
                      type: string
                    wins:
                      type: integer
                      description: Count of recorded wins for this matchup
                    lose:
                      type: integer
                      description: Count of recorded losses for this matchup
        '400':
          description: Invalid or missing query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
        '404':
          description: No matching notes found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No matching notes found
        '409':
          description: Conflict (unique constraint violation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Unexpected server or database error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /get/totalWR:
    get:
      summary: Get total win rate for a matchup
      description: >
        Aggregates win/loss counts for matchups filtered by champion played,
        champion fighting, role, discord ID, or puuid, and returns an overall
        win rate. Either puuid or discordId is required.
      tags:
        - Get
      parameters:
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
          description: Champion the player was playing
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
          description: Opposing champion in the matchup
        - name: role
          in: query
          required: false
          schema:
            type: string
          description: Lane/role for the matchup
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID. Either this or discordId is required.
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Discord ID. Either this or puuid is required.
        - name: isWinFirst
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: If "true", sorts results by wins descending; otherwise sorts by losses descending.
      responses:
        '200':
          description: Aggregated win/loss breakdown per matchup, plus overall totals and win rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  withWinRate:
                    type: array
                    items:
                      type: object
                      properties:
                        champion_played:
                          type: string
                        champion_fighting:
                          type: string
                        role:
                          type: string
                        wins:
                          type: string
                          description: Win count (returned as string from Postgres COUNT)
                        loss:
                          type: string
                          description: Loss count (returned as string from Postgres COUNT)
                        winRate:
                          type: number
                          format: float
                          description: wins / (wins + loss) for this specific matchup
                  wr:
                    type: integer
                    description: Overall win rate percentage across all matched rows, rounded
                  totalWins:
                    type: integer
                  totalLoss:
                    type: integer
        '404':
          description: Neither puuid nor discordId was provided
          content:
            text/plain:
              schema:
                type: string
                example: either puuid or discordId must be filled
        '409':
          description: Invalid query parameters (Zod validation failure) or other request-time error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["Error: Invalid option: expected one of \"true\"|\"false\""]
  
  /get/user:
    get:
      tags:
        - Get
      summary: /get/user
      description: Returns all matchup notes recorded for a given user, optionally filtered by role
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          nullable: false
          example: "rin"
      - name: role
        in: query
        schema:
          type: string
          nullable: true
          example: "TOP"
      responses:
        "200":
          description: "Query Found"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Matchup"
        "404":
          description: "User not found or has no notes"

  /push/matchup:
    post:
      tags:
        - Push
      summary: /push/matchup
      description: Creates or updates a matchup note for the given champion pairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - puuid
                - championPlayed
                - championFighting
                - username
                - role
              properties:
                puuid:
                  type: string
                  example: "KdSK9Qcz1G71dOd0VvbMEv2QVL8Htr5MGdjS9vbprajckLR9zMYo8AWUlEzCzs780N9Eckq1TLzh4g"
                championPlayed:
                  type: string
                  example: "Renekton"
                championFighting:
                  type: string
                  example: "Yone"
                username:
                  type: string
                  example: "rin"
                role:
                  type: string
                  example: "TOP"
                notes:
                  type: string
                  nullable: true
                  example: "Punish early trades before level 3, watch for all-in at level 6"
                laning:
                  type: string
                  nullable: true
                teamFighting:
                  type: string
                  nullable: true
      responses:
        "201":
          description: "Note created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matchup"
        "200":
          description: "Existing note updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matchup"
        "400":
          description: "Missing required fields"