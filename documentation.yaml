openapi: 3.1.0
info:
  title: Speed-watches
  description: This API is for G2R members to take notes on the matchups they may encounter on league of legends.
  version: 1.0.0
paths:
  /speedwatches/match/check:
    get:
      summary: update the database
      description: updates the database by checking the past 5 games of users in summonerusers collection.
      parameters: none
      responses:
        "200": saved
  /speedwatches/get/matchup:
    get:
      summary: get notes of specific matchup
      parameters:
        username:
          type: string or null
          description: username of query. Can be null
        championPlayed:
          type: string or null
          description: name of the champion you'd like to play as
        championFighting:
          type: string or null
          description: name of the champion you'd like to play against