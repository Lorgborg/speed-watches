openapi: 3.1.0
servers:
  - url: https://server-pc.tail66b2ee.ts.net/api/
    description: api production server
  - url: http://localhost:3000/api/
    description: Local dev server
info:
  title: Speed-watches
  description: >
    This API is for G2R members to take notes on the matchups they may
    encounter on league of legends. Note that a **bypass is required to
    access the api**.


    ⚠️ All routes — including the POST ones — currently read their
    parameters from the **query string** ('req.query'), not the JSON
    request body. This documentation reflects that as implemented.
  version: 1.2.0
tags:
  - name: Get
    description: Endpoints for retrieving matchup notes, game data, and user data
  - name: Post
    description: Endpoints for creating users, and creating/appending matchup notes
  - name: Update
    description: Endpoints intended to modify existing users or matchup notes
  - name: Remove
    description: Endpoints intended to remove matchup notes
  - name: Known Issues
    description: >
      Routes that are registered and reachable, but have bugs in their
      current implementation that mean they don't behave as their name
      suggests, or don't work at all yet. Included here so the surface
      area is visible, but none of these should be relied on until fixed.
components:
  schemas:
    Matchup:
      type: object
      properties:
        puuid:
          type: string
          example: "KdSK9Qcz1G71dOd0VvbMEv2QVL8Htr5MGdjS9vbprajckLR9zMYo8AWUlEzCzs780N9Eckq1TLzh4g"
        championFighting:
          type: string
          example: "Yone"
        championPlayed:
          type: string
          example: "Renekton"
        matchIds:
          type: array
          items:
            type: string
          example: ["SG2_161017792", "SG2_138469723"]
        pushing:
          type: string
          nullable: true
        teamFighting:
          type: string
          nullable: true
        laning:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        role:
          type: string
          example: "TOP"
        username:
          type: string
          example: "rin"
        discordId:
          type: string
          example: "400599101353492480"
    User:
      type: object
      description: A row from the postgres 'users' table.
      properties:
        username:
          type: string
          example: "rin"
        discordId:
          type: string
          example: "400599101353492480"
        puuid:
          type: string
          example: "KdSK9Qcz1G71dOd0VvbMEv2QVL8Htr5MGdjS9vbprajckLR9zMYo8AWUlEzCzs780N9Eckq1TLzh4g"
        summonerName:
          type: string
          nullable: true
        accountDetails:
          type: object
          description: Raw Riot summoner details, cached at user-creation time
        rank:
          type: array
          description: Raw Riot ranked-entries payload, cached at user-creation time
        topMastery:
          type: array
          description: Player's top champion mastery entries, cached at user-creation time
        backfillComplete:
          type: boolean
          description: Whether historical match backfill has finished for this user
    GameRow:
      type: object
      description: A row from the postgres 'games' table, joined with 'users'.
      properties:
        username:
          type: string
        puuid:
          type: string
        match_id:
          type: string
        champion_played:
          type: string
        champion_fighting:
          type: string
        role:
          type: string
        kda:
          type: string
          example: "5/2/9"
        is_win:
          type: boolean
        game_length:
          type: integer
          description: Game length in seconds
        champ_composition:
          type: array
          items:
            type: string
        info:
          type: object
          description: Raw Riot match 'info' payload (only returned by /get/gameInfo)
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
paths:

  /get/matchup:
    get:
      summary: Get matchup notes
      description: >
        Retrieves matchup notes filtered by any combination of champion played,
        champion fighting, role, or user identity. Exactly one of 'puuid',
        'summonerName', or 'discordId' must be supplied to identify the user.
      tags:
        - Get
      parameters:
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
          description: Champion the note author was playing
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
          description: Opposing champion in the matchup
        - name: role
          in: query
          required: false
          schema:
            type: string
          description: Lane/role for the matchup
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID of the note author. Mutually exclusive with summonerName/discordId.
        - name: summonerName
          in: query
          required: false
          schema:
            type: string
          description: >
            Summoner name, resolved to a PUUID via the Riot API at request time.
            Mutually exclusive with puuid/discordId.
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Discord ID of the note author. Mutually exclusive with puuid/summonerName.
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: G2R username of the note author (additional filter, not an identifier)
      responses:
        '200':
          description: Matching matchup notes with aggregated win/loss counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    puuid:
                      type: string
                    champion_played:
                      type: string
                    champion_fighting:
                      type: string
                    role:
                      type: string
                    notes:
                      type: string
                    wins:
                      type: integer
                    lose:
                      type: integer
        '400':
          description: >
            Invalid query parameters, or none/more than one of
            puuid/summonerName/discordId supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: No matching notes found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: Conflict (unique constraint violation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Unexpected server or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to resolve summonerName via the Riot API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /get/totalWR:
    get:
      summary: Get total win rate for a matchup
      description: >
        Aggregates win/loss counts for matchups filtered by champion played,
        champion fighting, role, discord ID, or puuid, and returns an overall
        win rate. Either 'puuid' or 'discordId' is required.
      tags:
        - Get
      parameters:
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID. Either this or discordId is required.
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
        - name: isWinFirst
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: If "true", sorts results by wins descending; otherwise sorts by losses descending.
        - name: discordId
          in: query
          required: false
          schema:
            type: string
          description: Discord ID. Either this or puuid is required.
      responses:
        '200':
          description: Aggregated win/loss breakdown per matchup, plus overall totals and win rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  withWinRate:
                    type: array
                    items:
                      type: object
                      properties:
                        champion_played:
                          type: string
                        champion_fighting:
                          type: string
                        role:
                          type: string
                        wins:
                          type: string
                        loss:
                          type: string
                        winRate:
                          type: number
                          format: float
                  wr:
                    type: integer
                  totalWins:
                    type: integer
                  totalLoss:
                    type: integer
        '400':
          description: Neither puuid nor discordId was provided, or a Zod validation error occurred
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["Error: Invalid option: expected one of \"true\"|\"false\""]
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /get/user:
    get:
      tags:
        - Get
      summary: Get a user by username, puuid, or discord ID
      description: Looks up matching row(s) from the 'users' table.
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: discordId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching user row(s)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /get/game:
    get:
      tags:
        - Get
      summary: Get game rows
      description: >
        gets games. Returning a lot of games could cause the docs page to hang
      parameters:
        - name: discordId
          in: query
          required: true
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: matchId
          in: query
          required: false
          schema:
            type: string
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
      responses:
        '500':
          description: Currently always errors due to malformed SQL (missing FROM clause)

  /get/gameInfo:
    get:
      tags:
        - Get
      summary: Get game rows including full raw match info
      description: >
        gets games. Returning a lot of games could cause the docs page to hang. This is expensive to get, please 
      parameters:
        - name: discordId
          in: query
          required: true
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: matchId
          in: query
          required: false
          schema:
            type: string
        - name: championFighting
          in: query
          required: false
          schema:
            type: string
        - name: championPlayed
          in: query
          required: false
          schema:
            type: string
      responses:
        '500':
          description: Currently always errors due to malformed SQL (missing FROM clause)

  /post/user:
    post:
      tags:
        - Post
      summary: Create a user
      description: >
        Creates a row in the 'users' table. Parameters are read from the
        **query string**, not a JSON body. Either 'puuid' or 'summonerName'
        must be provided — if 'summonerName' is given it's resolved to a
        PUUID via the main Riot token, which becomes the canonical stored
        puuid. Kicks off an async match-history backfill on success.


        ⚠️ **Known issue:** 'api/routes/update/user.ts' also registers a
        handler for 'POST /post/user' (rather than '/update/user', which its
        folder location implies). Because route folders are loaded in the
        order 'get, post, remove, update', this file's own handler in
        'post/user.ts' is always matched first — the 'update/user.ts'
        handler is currently dead code and never runs.
      parameters:
        - name: discordId
          in: query
          required: true
          schema:
            type: string
          description: Discord snowflake ID; validated as a 17-19 digit numeric ID with a plausible creation timestamp
        - name: puuid
          in: query
          required: false
          schema:
            type: string
          description: Riot PUUID. Provide this or summonerName.
        - name: summonerName
          in: query
          required: false
          schema:
            type: string
          description: Riot ID (e.g. "Name#TAG"). Provide this or puuid.
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Defaults to "none" if omitted
      responses:
        "200":
          description: User saved successfully
          content:
            text/plain:
              schema:
                type: string
                example: "user with info <puuid> saved"
        "400":
          description: >
            Invalid query parameters, invalid discordId, neither
            puuid nor summonerName supplied, or the user/discordId
            already exists
          content:
            text/plain:
              schema:
                type: string

  /post/matchupNote:
    post:
      tags:
        - Post
      summary: Append notes to a matchup
      description: >
        Appends the given note strings onto the existing 'notes' array for
        matching row(s) in the 'notes' table ('notes = notes || <new notes>').
        Parameters are read from the query string.
      parameters:
        - name: discordId
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: notes
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
            example: ["Don't int"]
        - name: championFighting
          in: query
          required: true
          schema:
            type: string
        - name: championPlayed
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Note updated
          content:
            text/plain:
              schema:
                type: string
                example: "note updated"

  /update/matchupNote:
    post:
      tags:
        - Update
      summary: Append notes to a matchup (update variant)
      description: >
        Functionally identical to '/post/matchupNote' — appends the given
        note strings onto the existing 'notes' array. Parameters are read
        from the query string.
      parameters:
        - name: discordId
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: notes
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: championFighting
          in: query
          required: true
          schema:
            type: string
        - name: championPlayed
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Note updated
          content:
            text/plain:
              schema:
                type: string
                example: "note updated"

  /remove/matchupNote:
    post:
      tags:
        - Known Issues
        - Remove
      summary: Remove notes from a matchup (currently appends instead)
      description: >
        🚧 **Behaves incorrectly.** Despite the route name and folder,
        'api/routes/remove/matchupNote.ts' runs the exact same query as
        '/post/matchupNote' and '/update/matchupNote'
        ('notes = notes || <new notes>'), which **appends** to the notes
        array rather than removing anything from it. Do not use this route
        expecting deletion behavior until it's fixed.
      parameters:
        - name: discordId
          in: query
          required: false
          schema:
            type: string
        - name: puuid
          in: query
          required: false
          schema:
            type: string
        - name: notes
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: Currently appended rather than removed — see description above
        - name: championFighting
          in: query
          required: true
          schema:
            type: string
        - name: championPlayed
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Note updated (appended, not removed — see summary)
          content:
            text/plain:
              schema:
                type: string
                example: "note updated"