openapi: 3.1.0
info:
  title: Speed-watches
  description: This API is for G2R members to take notes on the matchups they may encounter on league of legends.
  version: 1.0.0
paths:
  /speedwatches/match/check:
    get:
      summary: updates the database by checking the past 5 games of users in summonerusers collection.
      parameters: none
      responses:
        "200": saved